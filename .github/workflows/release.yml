name: Create Release from Tag

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository (full history & tags)
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build fat jar (shadowJar) for `burp` subproject
        run: |
          ./gradlew :burp:shadowJar -x test --no-daemon


      - name: Get tag description/message
        id: get_tag_message
        run: |
          set -euo pipefail
          git fetch --prune --tags || true
          TAG=${GITHUB_REF#refs/tags/}

          # For annotated tags, read the tag object contents
          TAG_BODY=$(git for-each-ref --format='%(contents)' "refs/tags/$TAG" 2>/dev/null || true)

          # If no annotated tag message, fall back to tagged commit message
          if [ -z "$TAG_BODY" ]; then
            TAG_BODY=$(git log -1 --pretty=format:%B "$TAG" 2>/dev/null || true)
          fi

          if [ -z "$TAG_BODY" ]; then
            TAG_BODY=""
          fi

          echo "tag_body<<EOF" >> $GITHUB_OUTPUT
          printf "%s\n" "$TAG_BODY" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create GitHub Release and upload asset
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: ${{ steps.get_tag_message.outputs.tag_body }}
          files: burp/build/libs/burp.jar
          draft: false
          prerelease: false


